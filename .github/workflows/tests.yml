name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  phpunit:
    name: PHPUnit with coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, dom, fileinfo, intl, mbstring, pcov, pdo_sqlite, sqlite3
          coverage: pcov

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Audit Composer dependencies
        run: composer security:check

      - name: Check PHP formatting
        run: composer format:check

      - name: Run static analysis
        run: composer analyse

      - name: Run tests with coverage threshold
        run: composer test:coverage

  browser:
    name: Browser journeys
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, dom, fileinfo, intl, mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
          npm run build

      - name: Prepare browser test environment
        run: |
          cp .env.dusk.local .env
          touch database/dusk.sqlite
          php artisan migrate --force
          php artisan dusk:chrome-driver --detect

      - name: Start application server
        run: |
          ./vendor/laravel/dusk/bin/chromedriver-linux --port=9515 > storage/logs/chromedriver.log 2>&1 &
          php artisan serve --host=127.0.0.1 --port=8012 > storage/logs/dusk-server.log 2>&1 &
          for attempt in {1..15}; do
            curl --fail --silent http://127.0.0.1:8012/ > /dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Run browser journeys
        run: composer test:browser

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-artifacts
          path: |
            tests/Browser/screenshots
            tests/Browser/console
            tests/Browser/source
            storage/logs/dusk-server.log
            storage/logs/chromedriver.log
            storage/logs/laravel.log
          if-no-files-found: ignore
